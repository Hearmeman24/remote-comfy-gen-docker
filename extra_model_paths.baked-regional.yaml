# The handler and ComfyUI scan the baked /ComfyUI/models root by default.
# Only the supplemental regional volume is declared here to avoid adding the
# same baked files a second time under a duplicate model alias.
network_volume:
    base_path: /runpod-volume/ComfyUI/models
    checkpoints: checkpoints
    clip: clip
    clip_vision: clip_vision
    controlnet: controlnet
    diffusion_models: diffusion_models
    embeddings: embeddings
    frame_interpolation: frame_interpolation
    loras: loras
    style_models: style_models
    seedvr2: SEEDVR2
    text_encoders: text_encoders
    unet: unet
    upscale_models: upscale_models
    latent_upscale_models: latent_upscale_models
    detection: detection
    vae: vae
    vae_approx: vae_approx
